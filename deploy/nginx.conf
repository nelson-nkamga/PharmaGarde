server {
    listen 80;
    server_name pharmagarde.example.cm;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pharmagarde.example.cm;
    # certificat : certbot --nginx -d pharmagarde.example.cm
    ssl_certificate     /etc/letsencrypt/live/pharmagarde.example.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pharmagarde.example.cm/privkey.pem;

    client_max_body_size 3m;                       # import CSV (2 Mo max côté application)
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /static/ {
        alias /opt/pharmagarde/app/static/;
        expires 7d;
        access_log off;
    }
    location / {
        proxy_pass http://unix:/run/pharmagarde/app.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
